<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content" />
  <meta name="theme-color" content="#18191b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="/assets/manifest.webmanifest" />
  <link rel="stylesheet" href="/assets/style.css" />
  <title>Pocket ChatGPT Bridge</title>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button id="showSessions" class="icon-button" aria-label="대화 목록 열기" title="대화 목록">☰</button>
      <h1 id="chatTitle">대화 선택</h1>
      <button id="openMenu" class="icon-button" aria-label="메뉴 열기" title="메뉴">⋯</button>
    </header>
    <div id="pairing" class="pairing">
      <div class="panel"><h1>노트북에 연결</h1><p>아이폰 카메라로 노트북 실행 창의 QR 코드를 비추고, 뜨는 링크를 누르세요.</p><p class="muted">Tailscale은 노트북과 같은 계정으로 연결해 두세요.</p>
        <details><summary>직접 연결하기</summary><p>노트북의 고급 연결 정보에 있는 연결 키를 입력하세요.</p><input id="pairToken" type="password" placeholder="연결 키" autocomplete="off" /><button class="primary" id="pairButton">연결하기</button></details><div id="pairError" class="error" role="alert"></div>
      </div>
    </div>
    <main id="workspace" hidden>
      <section id="chatPane" class="chat-pane">
        <div id="messageScroll" class="message-scroll" tabindex="0" aria-label="대화 내역">
          <button id="olderMessages" class="older" hidden>이전 메시지 더 보기</button>
          <div id="chatEmpty" class="empty-state"><p>이어갈 대화를 선택해 주세요.</p><button id="chooseChat">대화 목록 열기</button></div>
          <div id="messageList" class="message-list" role="log" aria-label="메시지"></div><div id="replyState" class="reply-state" hidden></div>
        </div><button id="jumpLatest" class="jump-latest" hidden>새 메시지 ↓</button>
      </section>
    </main>
    <div id="pendingPanel" class="pending-panel" hidden><p id="pendingNote">전송 결과를 확인하고 있습니다.</p><button id="checkPending" type="button">전송 결과 확인</button><button id="clearPending" type="button">대화 확인 후 새로 작성</button></div>
    <form id="composer" hidden><div class="input-wrap"><textarea id="message" placeholder="메시지 보내기" rows="1" maxlength="12000" aria-label="메시지"></textarea><button id="sendButton" type="submit" class="primary" aria-label="메시지 전송">↑</button></div></form>
    <div id="toast" role="status" aria-live="polite"></div>
  </div>
  <section id="sessionsPane" class="pane overlay-panel" popover="auto" role="dialog" aria-label="대화 목록">
    <div class="bar"><h2>최근 대화</h2><button id="refreshSessions" aria-label="대화 목록 새로고침">↻</button><button id="showChat" aria-label="대화 목록 닫기">✕</button></div><p class="hint">프로젝트 포함 · 최근 수정한 순서</p>
    <input id="sessionSearch" placeholder="대화 검색" aria-label="대화 검색" /><div id="sessionList" class="session-list"></div><button id="moreSessions" class="wide" hidden>이전 대화 더 보기</button><div id="sessionNote" class="muted"></div>
  </section>
  <section id="menuPopover" class="menu-popover overlay-panel" popover="auto" role="dialog" aria-label="메뉴">
    <div id="connection" class="muted">연결 대기</div><p id="chatState" class="muted"></p>
    <button id="refreshChat">대화 새로고침</button><button id="newSession">새 대화</button><button id="showPreview">노트북 조작</button><button id="openDisplaySettings">화면 설정</button><button id="settingsButton">이 폰의 연결 해제</button>
  </section>
  <section id="displaySettings" class="pane overlay-panel" popover="auto" role="dialog" aria-label="화면 설정">
    <div class="bar"><h2>화면 설정</h2><button id="closeDisplaySettings" aria-label="화면 설정 닫기">✕</button></div>
    <p class="hint">전체 모니터 밝기</p><div class="bar"><button id="dimLaptop">최소로 낮추기</button><button id="restoreLaptop">원래대로</button></div>
    <p class="hint">외부 모니터 출력</p><div class="bar"><button id="externalOff">끄기</button><button id="externalOn">다시 켜기</button></div>
  </section>
  <section id="previewPane" class="pane overlay-panel" popover="auto" role="dialog" aria-label="노트북 조작">
    <div class="bar"><h2>노트북 조작</h2><button id="closePreview" aria-label="노트북 조작 닫기">✕</button></div>
    <div class="bar preview-toolbar"><button id="activateDesktop">창 활성화</button><button id="refreshPreview" aria-label="노트북 화면 새로고침">↻</button></div>
    <p class="hint">화면을 탭하면 노트북의 해당 위치를 클릭합니다.</p>
    <div class="preview-wrap" id="previewWrap"><img id="previewImage" alt="ChatGPT 데스크톱 창 캡처" /><div id="previewPlaceholder">화면 연결 대기</div></div>
    <div class="bar controls"><button id="scrollUp">↑ 위로</button><button id="scrollDown">↓ 아래로</button><button id="zoomOut">− 축소</button><button id="zoomIn">＋ 확대</button></div><label class="switch"><input id="autoPreview" type="checkbox" checked /> 화면 자동 갱신</label>
  </section>
  <section id="imageViewer" class="image-viewer" popover="auto" role="dialog" aria-label="이미지 확대 보기">
    <div class="viewer-toolbar"><button id="zoomImage">확대</button><button id="closeImage" aria-label="이미지 닫기">✕</button></div><div id="imageCanvas" class="image-canvas"><img id="fullImage" alt="확대한 이미지" /></div>
  </section>
  <script src="/assets/marked.js" defer></script><script src="/assets/purify.js" defer></script><script src="/assets/app.js" defer></script>
</body>
</html>
